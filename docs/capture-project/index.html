<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLOR LAB / NIGHT</title><style>body{background:#0b1a3a;color:#e0e7ff}main{max-width:660px;margin:auto;padding:38px 30px}header{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;border-bottom:1px solid #2a3a6d;padding-bottom:18px;color:#a8baff}header strong{font-size:16px}small{color:#a0aaff}h1{font-size:33px;line-height:1.6;font-weight:500;margin:38px 0 12px;color:#cbd6ff}p{font-size:13px;line-height:1.9;color:#b0bfff}.lab{height:172px;position:relative;display:flex;justify-content:center;align-items:center;margin:15px 0}.color{width:130px;height:130px;border-radius:50%;background:#4177e3;mix-blend-mode:multiply;box-shadow:0 0 15px #3a5ecf}.yellow{background:#f7cd4c;margin-left:-35px;box-shadow:0 0 15px #d9b83f}.symbol{font-size:26px;margin-left:35px;color:#a8baff}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{font:inherit;font-size:13px;min-height:52px;background:#1a2a5a;border:1px solid #4a5a8a;border-radius:7px;color:#cbd6ff;cursor:pointer;box-shadow:0 0 8px #3a5ecf}button:hover{border-color:#7a8aff;background:#2a3a7a}button:focus-visible{outline:3px solid #7a8aff;outline-offset:3px}button i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;box-shadow:0 0 5px #3a5ecf}footer{border-top:1px solid #2a3a6d;margin-top:35px;padding-top:17px;font-size:10px;color:#7a8aff;display:flex;justify-content:space-between}#result{min-height:26px;font-size:13px;color:#a0aaff;margin-top:19px}.again{min-height:35px;border:0;background:none;padding:0;color:#7a8aff;font-size:11px}
*{box-sizing:border-box}body{margin:0;background:#f4f3eb;color:#243529;font-family:Arial,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:660px;margin:auto;padding:38px 30px}header{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;border-bottom:1px solid #d8decd;padding-bottom:18px}header strong{font-size:16px}small{color:#66795e}h1{font-size:33px;line-height:1.6;font-weight:500;margin:38px 0 12px}p{font-size:13px;line-height:1.9;color:#67755e}.lab{height:172px;position:relative;display:flex;justify-content:center;align-items:center;margin:15px 0}.color{width:130px;height:130px;border-radius:50%;background:#4177e3;mix-blend-mode:multiply}.yellow{background:#f7cd4c;margin-left:-35px}.symbol{font-size:26px;margin-left:35px;color:#6b7b61}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{font:inherit;font-size:13px;min-height:52px;background:#fff;border:1px solid #c8d3be;border-radius:7px;color:#34442e;cursor:pointer}button:hover{border-color:#3f8055;background:#e7f0de}button:focus-visible{outline:3px solid #3072b7;outline-offset:3px}button i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px}footer{border-top:1px solid #d8decd;margin-top:35px;padding-top:17px;font-size:10px;color:#718168;display:flex;justify-content:space-between}#result{min-height:26px;font-size:13px;color:#3e734b;margin-top:19px}.again{min-height:35px;border:0;background:none;padding:0;color:#66795e;font-size:11px}
</style></head><body><main><header><strong>COLOR LAB<span style="color:#88a576"> ◈</span></strong><small>色のふしぎを、見つけよう。</small></header><small style="display:block;margin-top:32px">QUESTION 01 / 色を混ぜる</small><h1>青と黄色を混ぜたら、<br>何色になる？</h1><p>２つの絵の具から、新しい色をつくろう。</p><div class="lab" aria-hidden="true"><span class="color"></span><span class="color yellow"></span><span class="symbol">= ?</span></div><div class="choices"><button data-answer="yes"><i style="background:#6a9f65"></i>緑</button><button data-answer="no"><i style="background:#ac89c0"></i>紫</button><button data-answer="no"><i style="background:#da9574"></i>オレンジ</button></div><p id="result" role="status">どの色だと思う？ 選んでみよう。</p><button class="again" id="reset">↺ もう一度試す</button><footer><span>小さな発見を、次のアイデアに。</span><span>MY FIRST PROJECT</span></footer></main><script>document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>document.getElementById('result').textContent=b.dataset.answer==='yes'?'正解！ 青と黄色の絵の具を混ぜると緑になります。':'惜しい！ 重なったところの色に注目してみよう。'));document.getElementById('reset').addEventListener('click',()=>document.getElementById('result').textContent='どの色だと思う？ 選んでみよう。');</script></body></html>
