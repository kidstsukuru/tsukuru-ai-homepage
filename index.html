<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ツクルAI</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #12182a;
        --text: #eef3ff;
        --muted: #8b98b5;
        --accent: #1eb8e8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 14px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #061018;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ツクルAI</h1>
      <p>
        紹介サイトはいったん停止しています。<br />
        Webアプリはこちらから開けます。
      </p>
      <a href="https://tsukuru-ai-pink.vercel.app/">Webアプリを開く</a>
    </main>
  </body>
</html>
